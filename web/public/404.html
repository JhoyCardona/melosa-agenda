<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Melosa</title>
    <script>
      // Redirects a deep-link 404 (e.g. /melosa-agenda/agendar on a hard
      // refresh) back to index.html with the real path packed into the query
      // string, which index.html then unpacks via history.replaceState.
      // pathSegmentsToKeep = 1 keeps "/melosa-agenda" as the site root.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
