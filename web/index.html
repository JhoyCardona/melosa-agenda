<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Melosa — tortas y minicakes hechas a pedido en Medellín. Agendá tu pedido en línea y recogé en el local."
    />
    <meta name="theme-color" content="#c82333" />
    <title>Melosa — Tortas y minicakes a pedido</title>

    <!-- Google Fonts is the one external host allowed by the deploy target.
         Dirección A: Fraunces (display) + Nunito Sans (body). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // GitHub Pages has no server-side rewrites, so a hard refresh on a deep
      // link (e.g. /melosa-agenda/agendar) 404s. The matching redirect script
      // in public/404.html encodes that path into a query string and bounces
      // here; this restores the real path via history.replaceState before
      // React Router ever sees it. See https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
